apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: tp15
    includeSelectors: false

# Le nom réel de la ConfigMap reçoit un suffixe de hash : toute modification
# du contenu change le nom, donc le Deployment, donc déclenche un redéploiement.
configMapGenerator:
  - name: whoami-config
    literals:
      - WHOAMI_NAME=base
      - LOG_LEVEL=info
