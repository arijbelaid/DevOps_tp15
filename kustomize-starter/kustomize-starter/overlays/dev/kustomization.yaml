# Exemple complet d'overlay : servez-vous-en comme modèle pour staging et prod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tp15-dev

resources:
  - ../../base
  - namespace.yaml

configMapGenerator:
  - name: whoami-config
    behavior: merge
    literals:
      - WHOAMI_NAME=dev
      - LOG_LEVEL=debug

replicas:
  - name: whoami
    count: 1
