apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "whoami.fullname" . }}
  labels:
    {{- include "whoami.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "whoami.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "whoami.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--port", "{{ .Values.containerPort }}"]
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          # TODO (partie 2) : boucle range sur .Values.env pour générer la liste env:
          # TODO (partie 2) : readinessProbe / livenessProbe sur /health (port http)
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
